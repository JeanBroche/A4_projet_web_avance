name: Stale

on:
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    name: Mark stale issues and PRs
    runs-on: ubuntu-latest
    steps:
      - name: Run stale bot
        uses: actions/stale@v9
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          stale-issue-message: >
            Cette issue est inactive depuis 60 jours. Elle sera fermée dans 14 jours
            sans nouvelle activité.
          close-issue-message: >
            Issue fermée automatiquement faute d'activité.
          stale-pr-message: >
            Cette PR est inactive depuis 30 jours. Elle sera fermée dans 14 jours
            sans nouvelle activité.
          close-pr-message: >
            PR fermée automatiquement faute d'activité.
          days-before-issue-stale: 60
          days-before-issue-close: 14
          days-before-pr-stale: 30
          days-before-pr-close: 14
