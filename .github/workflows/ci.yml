name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  markdown:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Lint Markdown files
        uses: DavidAnson/markdownlint-cli2-action@v18
        with:
          globs: "**/*.md"

  node:
    name: Node.js (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    env:
      POSTGRES_URL: postgresql://ci:ci@localhost:5432/ci
      JWT_SECRET: ci-test-jwt-secret
      SEED_ADMIN_PASSWORD: ci-test-password
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Detect package.json
        id: pkg
        run: |
          if [ -f package.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install pnpm
        if: steps.pkg.outputs.exists == 'true'
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        if: steps.pkg.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        if: steps.pkg.outputs.exists == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build workspace dependencies
        if: steps.pkg.outputs.exists == 'true'
        run: pnpm --filter @aeronexis/db build

      - name: Lint
        if: steps.pkg.outputs.exists == 'true'
        run: pnpm run lint

      - name: Typecheck
        if: steps.pkg.outputs.exists == 'true'
        run: pnpm run typecheck

      - name: Test
        if: steps.pkg.outputs.exists == 'true'
        run: pnpm run test

      - name: Build
        if: steps.pkg.outputs.exists == 'true'
        run: pnpm run build
