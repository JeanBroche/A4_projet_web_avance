services:
  db-migrate:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.migrate
    container_name: aeronexis-db-migrate
    env_file:
      - ../../.env.docker
    depends_on:
      postgres-auth:
        condition: service_healthy
      postgres-stock:
        condition: service_healthy
      postgres-order:
        condition: service_healthy
      postgres-production:
        condition: service_healthy
      postgres-shipment:
        condition: service_healthy
    restart: "no"

  auth:
    build:
      context: ../..
      dockerfile: services/auth/Dockerfile
    container_name: aeronexis-auth
    env_file:
      - ../../.env.docker
    environment:
      NODE_ID: auth
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      postgres-auth:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  stock:
    build:
      context: ../..
      dockerfile: services/stock/Dockerfile
    container_name: aeronexis-stock
    env_file:
      - ../../.env.docker
    environment:
      NODE_ID: stock
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      postgres-stock:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  order:
    build:
      context: ../..
      dockerfile: services/order/Dockerfile
    container_name: aeronexis-order
    env_file:
      - ../../.env.docker
    environment:
      NODE_ID: order
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      postgres-order:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  production:
    build:
      context: ../..
      dockerfile: services/production/Dockerfile
    container_name: aeronexis-production
    env_file:
      - ../../.env.docker
    environment:
      NODE_ID: production
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      postgres-production:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  shipment:
    build:
      context: ../..
      dockerfile: services/shipment/Dockerfile
    container_name: aeronexis-shipment
    env_file:
      - ../../.env.docker
    environment:
      NODE_ID: shipment
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      postgres-shipment:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  audit:
    build:
      context: ../..
      dockerfile: services/audit/Dockerfile
    container_name: aeronexis-audit
    env_file:
      - ../../.env.docker
    environment:
      NODE_ID: audit
    depends_on:
      mongo:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    restart: unless-stopped

  notification:
    build:
      context: ../..
      dockerfile: services/notification/Dockerfile
    container_name: aeronexis-notification
    env_file:
      - ../../.env.docker
    environment:
      NODE_ID: notification
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  reporting:
    build:
      context: ../..
      dockerfile: services/reporting/Dockerfile
    container_name: aeronexis-reporting
    env_file:
      - ../../.env.docker
    environment:
      NODE_ID: reporting
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
