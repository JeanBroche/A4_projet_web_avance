x-postgres-service: &postgres-service
  image: postgres:16-alpine
  restart: unless-stopped

services:
  postgres-auth:
    <<: *postgres-service
    container_name: aeronexis-postgres-auth
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aeronexis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aeronexis_dev}
      POSTGRES_DB: aeronexis_auth
    ports:
      - "${AUTH_PG_PORT:-5432}:5432"
    volumes:
      - pg_auth_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aeronexis -d aeronexis_auth"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  postgres-stock:
    <<: *postgres-service
    container_name: aeronexis-postgres-stock
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aeronexis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aeronexis_dev}
      POSTGRES_DB: aeronexis_stock
    ports:
      - "${STOCK_PG_PORT:-5433}:5432"
    volumes:
      - pg_stock_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aeronexis -d aeronexis_stock"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  postgres-commande:
    <<: *postgres-service
    container_name: aeronexis-postgres-commande
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aeronexis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aeronexis_dev}
      POSTGRES_DB: aeronexis_commande
    ports:
      - "${COMMANDE_PG_PORT:-5434}:5432"
    volumes:
      - pg_commande_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aeronexis -d aeronexis_commande"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  postgres-production:
    <<: *postgres-service
    container_name: aeronexis-postgres-production
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aeronexis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aeronexis_dev}
      POSTGRES_DB: aeronexis_production
    ports:
      - "${PRODUCTION_PG_PORT:-5435}:5432"
    volumes:
      - pg_production_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aeronexis -d aeronexis_production"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  postgres-expedition:
    <<: *postgres-service
    container_name: aeronexis-postgres-expedition
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aeronexis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aeronexis_dev}
      POSTGRES_DB: aeronexis_expedition
    ports:
      - "${EXPEDITION_PG_PORT:-5436}:5432"
    volumes:
      - pg_expedition_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aeronexis -d aeronexis_expedition"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  mongo:
    image: mongo:7
    container_name: aeronexis-mongo
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  mongo-init:
    image: node:20-alpine
    container_name: aeronexis-mongo-init
    depends_on:
      mongo:
        condition: service_healthy
    working_dir: /app
    volumes:
      - ../mongo:/app
      - mongo_init_modules:/app/node_modules
    environment:
      MONGO_URI: mongodb://mongo:27017/aeronexis
    entrypoint:
      - /bin/sh
      - -c
      - |
        corepack enable &&
        pnpm install --ignore-workspace --prefer-offline &&
        pnpm run init
    restart: "no"

  redis:
    image: redis:7-alpine
    container_name: aeronexis-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  kafka:
    image: apache/kafka:3.8.1
    container_name: aeronexis-kafka
    hostname: kafka
    restart: unless-stopped
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092",
        ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  minio:
    image: minio/minio:latest
    container_name: aeronexis-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  minio-init:
    image: minio/mc:latest
    container_name: aeronexis-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-aeronexis-docs}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ACCESS_KEY $$MINIO_SECRET_KEY &&
      mc mb --ignore-existing local/$$MINIO_BUCKET &&
      exit 0
      "
    restart: "no"

volumes:
  pg_auth_data:
  pg_stock_data:
  pg_commande_data:
  pg_production_data:
  pg_expedition_data:
  mongo_data:
  mongo_init_modules:
  redis_data:
  kafka_data:
  minio_data:
